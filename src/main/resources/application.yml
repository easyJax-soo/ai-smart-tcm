spring:
  application:
    name: ai-smart-cloud
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:30379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  ai:
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      chat:
        options:
          model: MiniMax-M2.7-highspeed
          max-tokens: 4096
          temperature: 0.7
    openai:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: https://api.siliconflow.cn
      embedding:
        options:
          model: Qwen/Qwen3-Embedding-0.6B
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

# 聊天记忆（PG + Redis 双层，Redis 可选）
chat:
  memory:
    window-size: 20                  # 每个 chatId 保留最近 N 条消息
    redis:
      enabled: ${CHAT_MEMORY_REDIS_ENABLED:false}   # 默认关,避免启动期连不上 Redis 报错
      key-prefix: "chat:memory:"
      ttl: 24h

search-api:
  api-key: ${SEARCH_API_KEY:}

server:
  port: 38022
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.bobo.aismartcloud.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis-Plus 配置（chat_memory 表通过 ChatMemoryMapper 访问）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto