spring:
  application:
    name: ai-smart-cloud
  profiles:
    active: local
  ai:
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      chat:
        options:
          model: MiniMax-M2.7-highspeed
          max-tokens: 4096
          temperature: 0.7
    openai:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: https://api.siliconflow.cn/v1/embeddings
      embedding:
        model: Qwen/Qwen3-Embedding-0.6B
server:
  port: 38022
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.bobo.aismartcloud.controller

knife4j:
  enable: true
  setting:
    language: zh_cn